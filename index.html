<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Galaxy 3D</title>
    <link rel="icon" type="image/png" href="assets/images/planet.png">

    <!-- Three.js Import Map -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.152.2/examples/jsm/controls/OrbitControls.js",
        "three/addons/loaders/FontLoader.js": "https://unpkg.com/three@0.152.2/examples/jsm/loaders/FontLoader.js",
        "three/addons/geometries/TextGeometry.js": "https://unpkg.com/three@0.152.2/examples/jsm/geometries/TextGeometry.js"
      }
    }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Loading overlay */
        #loading {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
            color: #fff;
            transition: opacity 0.8s ease;
        }
        #loading.hide {
            opacity: 0;
            pointer-events: none;
        }
        #loading .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #ff6b6b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.6);
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #loading .title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #loading .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 10px;
        }

        /* Instruction overlay */
        #instruction {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 13px;
            z-index: 100;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: opacity 0.5s ease;
            text-align: center;
            max-width: 90vw;
        }
        #instruction.hide {
            opacity: 0;
        }

        /* Letter button */
        #letterBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            border: 1.5px solid #ff6b6b;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        #letterBtn:hover {
            background: rgba(255, 107, 107, 0.3);
            transform: scale(1.1);
        }
        #letterBtn img {
            width: 28px;
            height: 28px;
            pointer-events: none;
        }

        /* Gift button (toggle flower ring flying) */
        #giftBtn {
            position: fixed;
            top: 20px;
            right: 80px;
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            border: 1.5px solid #ff6b6b;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        #giftBtn:hover {
            background: rgba(255, 107, 107, 0.3);
            transform: scale(1.1);
        }
        #giftBtn img {
            width: 28px;
            height: 28px;
            pointer-events: none;
        }

        /* Toast notification */
        #toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 107, 107, 0.95);
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.4);
            pointer-events: none;
        }
        #toast.show {
            opacity: 1;
        }
    </style>
</head>

<body>

    <!-- Loading Screen -->
    <div id="loading">
        <div class="spinner"></div>
        <div class="title">Loading Galaxy</div>
        <div class="subtitle">Sabar yaa, planet nya lagi loading 🚀</div>
    </div>

    <!-- Instruction -->
    <div id="instruction">
        🖱️ Drag untuk rotate • Scroll untuk zoom • Klik 2x untuk efek
    </div>

    <!-- Letter button (toggle text 3D) -->
    <button id="letterBtn" title="Toggle Text 3D">
        <img src="assets/images/letter.gif" alt="Letter">
    </button>

    <!-- Gift button (toggle flower ring flying) -->
    <button id="giftBtn" title="Toggle Flower Ring Flying">
        <img src="assets/images/new1.gif" alt="Gift">
    </button>

    <!-- Toast -->
    <div id="toast"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { ParticleSystem } from './js/particles.js';
        import { CentralSphere } from './js/sphere.js';
        import { FlowerRingSystem } from './js/imageRing.js';
        import { HeartText } from './js/heartText.js';
        import { CameraController } from './js/camera.js';

        // === SCENE SETUP ===
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000);
        document.body.appendChild(renderer.domElement);

        // === LIGHTS ===
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const light1 = new THREE.PointLight(0xffffff, 1, 1000);
        light1.position.set(200, 200, 200);
        scene.add(light1);

        const light2 = new THREE.PointLight(0xff88cc, 0.6, 1000);
        light2.position.set(-200, -100, -200);
        scene.add(light2);

        // === INIT SYSTEMS ===
        const particleSystem = new ParticleSystem(scene);
        const centralSphere = new CentralSphere(scene);
        centralSphere.setParticleSystem(particleSystem);

        const flowerRingSystem = new FlowerRingSystem(scene);
        centralSphere.setFlowerRing(flowerRingSystem);

        const heartText = new HeartText(scene);
        heartText.setText('Only For You');
        heartText.setEffect('none');

        const cameraController = new CameraController(camera, renderer);

        // === TOAST FUNCTION ===
        const toastEl = document.getElementById('toast');
        let toastTimer = null;
        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
        }

        // === DOUBLE CLICK ===
        window.addEventListener('dblclick', () => {
            cameraController.triggerAnimation();
            document.getElementById('instruction').classList.add('hide');
        });

        // === MOBILE DOUBLE TAP ===
        let lastTap = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTap < 350) {
                cameraController.triggerAnimation();
                document.getElementById('instruction').classList.add('hide');
            }
            lastTap = now;
        });

        // === KEYBOARD SHORTCUT ===
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowUp') {
                e.preventDefault();
                if (flowerRingSystem) {
                    if (!flowerRingSystem.isFlying) {
                        flowerRingSystem.triggerFlyingEffect();
                        showToast('🌸 Flower ring flying ON');
                    } else {
                        flowerRingSystem.toggleFlyingPause();
                        showToast(flowerRingSystem.isPaused ? '⏸️ Flying paused' : '▶️ Flying resumed');
                    }
                }
            }
        });

        // === LETTER BUTTON ===
        document.getElementById('letterBtn').addEventListener('click', () => {
            if (window.heartText) {
                if (window.heartText.isHidden) {
                    window.heartText.show();
                    window.heartText.setText(window.heartText.config.text);
                    showToast('💌 Text 3D shown');
                } else {
                    window.heartText.hide();
                    showToast('💌 Text 3D hidden');
                }
            }
        });

        // === GIFT BUTTON ===
        document.getElementById('giftBtn').addEventListener('click', () => {
            if (flowerRingSystem) {
                if (!flowerRingSystem.isFlying) {
                    flowerRingSystem.triggerFlyingEffect();
                    showToast('🌸 Flower ring flying ON');
                } else {
                    flowerRingSystem.toggleFlyingPause();
                    showToast(flowerRingSystem.isPaused ? '⏸️ Flying paused' : '▶️ Flying resumed');
                }
            }
        });

        // === RESIZE ===
        window.addEventListener('resize', () => {
            camera.width = window.innerWidth;
            camera.height = window.innerHeight;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            cameraController.handleResize();
        });

        // === ANIMATION LOOP ===
        function animate() {
            requestAnimationFrame(animate);

            particleSystem.animate();
            centralSphere.animate();
            flowerRingSystem.animate();
            cameraController.update();
            heartText.animate();

            renderer.render(scene, camera);
        }
        animate();

        // === HIDE LOADING AFTER 2s ===
        setTimeout(() => {
            document.getElementById('loading').classList.add('hide');
        }, 2000);

        // === EXPOSE TO WINDOW ===
        window.heartText = heartText;
        window.flowerRingSystem = flowerRingSystem;
        window.centralSphere = centralSphere;
        window.particleSystem = particleSystem;
        window.cameraController = cameraController;

        console.log('✅ Galaxy 3D loaded successfully!');
    </script>

</body>
</html>
