<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Particles</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js"
      }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ParticleSystem } from './js/particles.js';

        console.log('✅ Step 1: Three.js loaded');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000);
        document.body.appendChild(renderer.domElement);

        camera.position.set(0, 100, 500);
        camera.lookAt(0, 0, 0);

        console.log('✅ Step 2: Scene ready');

        try {
            const particleSystem = new ParticleSystem(scene);
            console.log('✅ Step 3: ParticleSystem created');

            function animate() {
                requestAnimationFrame(animate);
                if (particleSystem && particleSystem.animate) {
                    particleSystem.animate();
                }
                renderer.render(scene, camera);
            }
            animate();
            console.log('✅ Step 4: Animation started');
        } catch (e) {
            console.error('❌ ERROR in ParticleSystem:', e);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
