<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Sphere</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; }
        canvas { display: block; }
        #debug {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            border-radius: 6px;
            z-index: 9999;
            max-width: 400px;
            white-space: pre-wrap;
        }
        .err { color: #f44; }
        .ok { color: #0f0; }
    </style>
</head>
<body>
    <div id="debug">Debug:<br></div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js"
      }
    }
    </script>

    <script type="module">
        const dbg = document.getElementById('debug');
        function log(msg, isErr) {
            dbg.innerHTML += '<span class="' + (isErr ? 'err' : 'ok') + '">' + msg + '</span><br>';
            console.log(msg);
        }

        import * as THREE from 'three';
        log('Three.js: v' + THREE.REVISION);

        import { CentralSphere } from './js/sphere.js';
        log('sphere.js imported');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000);
        document.body.appendChild(renderer.domElement);

        camera.position.set(0, 100, 500);
        camera.lookAt(0, 0, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const l1 = new THREE.PointLight(0xffffff, 1, 1000);
        l1.position.set(200, 200, 200);
        scene.add(l1);

        let centralSphere;
        try {
            centralSphere = new CentralSphere(scene);
            log('✅ CentralSphere OK');
        } catch(e) {
            log('❌ CentralSphere: ' + e.message, true);
        }

        function animate() {
            requestAnimationFrame(animate);
            try {
                if (centralSphere && centralSphere.animate) {
                    centralSphere.animate();
                }
                renderer.render(scene, camera);
            } catch(e) {
                log('❌ Animate: ' + e.message, true);
            }
        }
        animate();
        log('Animation started');

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
